<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Firwork Show</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "Microsoft YaHei", cursive;
      overflow: hidden;
      background: #000;
    }

    #main-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      transition: opacity 0.8s ease;
    }

    .heart {
      position: relative;
      width: 100px;
      height: 100px;
      background: #ff4d94;
      transform: rotate(-45deg);
      animation: heartbeat 1.1s infinite, float 2s ease-in-out infinite;
      margin-bottom: 30px;
      box-shadow: 0 0 30px rgba(255, 77, 148, 0.6);
    }
    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 100px;
      height: 100px;
      background: #ff4d94;
      border-radius: 50%;
    }
    .heart::before { top: -50px; left: 0; }
    .heart::after { left: 50px; top: 0; }

    @keyframes heartbeat {
      0%, 28%, 70% { transform: rotate(-45deg) scale(1); }
      14%, 42% { transform: rotate(-45deg) scale(1.15); }
    }
    @keyframes float {
      0%, 100% { transform: rotate(-45deg) translateY(0); }
      50% { transform: rotate(-45deg) translateY(-10px); }
    }

    .message {
      color: white;
      font-size: 28px;
      text-align: center;
      max-width: 80%;
      margin-bottom: 30px;
      opacity: 0;
      animation: fadeIn 2s forwards;
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .btns {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 12px 30px;
      font-size: 18px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      letter-spacing: 1px;
    }
    #yes {
      background: linear-gradient(45deg, #ff4d94, #ff9a8b);
      color: white;
      box-shadow: 0 4px 15px rgba(255, 77, 148, 0.4);
    }
    #yes:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(255, 77, 148, 0.7);
    }
    #no {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(5px);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    #no:hover {
      transform: translateX(calc(var(--x, 0) * 120px)) translateY(calc(var(--y, 0) * 60px));
      background: rgba(255, 255, 255, 0.25);
    }

    #fireworks-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      display: none;
      z-index: 5;
    }
    canvas#fireworkCanvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #countdown {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 120px;
      color: white;
      font-weight: bold;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
      z-index: 20;
      opacity: 0;
    }

    .floating-text {
      position: absolute;
      color: rgba(255, 255, 255, 0.9);
      font-size: 24px;
      font-weight: bold;
      white-space: nowrap;
      pointer-events: none;
      z-index: 15;
	  top: 60px;
      opacity: 0;
      animation: fadeFloat 8s forwards;
	  
	  /* 彩虹渐变 */
	  background: linear-gradient(90deg, violet, red, indigo, green, yellow, orange, blue);
	  -webkit-background-clip: text;
	  background-clip: text;
	  color: transparent;
	  background-size: 300% auto;
    }
    @keyframes fadeFloat {
      0% { opacity: 0; transform: translateY(0); }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-100vh); }
    }
  </style>
</head>
<body>
  <!-- 主界面 -->
  <div id="main-screen">
    <div class="heart"></div>
    <div class="message">Hey，wanna to watch a firework with me？✨</div>
    <div class="btns">
      <button id="yes">YES！</button>
      <button id="no">Think a while…</button>
    </div>
  </div>

  <div id="fireworks-screen">
    <div id="countdown">5</div>
    <canvas id="fireworkCanvas"></canvas>
  </div>

  <audio id="bgm" preload="auto">
    <!--<source src="https://cdn.pixabay.com/download/audio/2026/01/25/audio_1dd7f3126d.mp3?filename=sonican-lo-fi-music-loop-sentimental-jazzy-love-473154.mp3/" type="audio/mpeg">-->
    <source src="https://cdn.pixabay.com/download/audio/2026/06/13/audio_c378a59dec.mp3?filename=happinessinmusic-romantic-jazz-sweet-550930.mp3/" type="audio/mpeg">
    你的浏览器不支持哦~~~
  </audio>

  <script>  

    const noBtn = document.getElementById('no');
    noBtn.addEventListener('mouseover', () => {
      const x = Math.random() > 0.5 ? 1 : -1;
      const y = Math.random() > 0.5 ? 1 : -1;
      noBtn.style.setProperty('--x', x);
      noBtn.style.setProperty('--y', y);
    });

    const yesBtn = document.getElementById('yes');
    const mainScreen = document.getElementById('main-screen');
    const fireworksScreen = document.getElementById('fireworks-screen');
    const countdownEl = document.getElementById('countdown');
    const canvas = document.getElementById('fireworkCanvas');
    const bgm = document.getElementById('bgm');


    function startCountdown() {
      let count = 5;
      countdownEl.textContent = count;
      countdownEl.style.opacity = '1';

      const countdownInterval = setInterval(() => {
        count--;
        if (count >= 0) {
          countdownEl.textContent = count;
          if (count === 0) {
            setTimeout(() => {
              countdownEl.style.opacity = '0';
            }, 500);
            playBGM();
            initFireworks();
            startFloatingText();
          }
        } else {
          clearInterval(countdownInterval);
        }
      }, 1000);
    }

    function playBGM() {
      bgm.volume = 0.5;
      bgm.play().catch(e => console.log("Auto-play prevented:", e));
    }

    function startFloatingText() {
      const phrases = [
		"❤️❤️❤️❤️", 
	    "❤️ 满天星辰 是你","❤️ 湖边暖风 是你","❤️ 柳絮飘然也 是你",
		"❤️ 春水初生 是你", "❤️ 晚风拂过 是你","❤️ 华灯初上 是你",
		"❤️ 道不尽的思念 是你", "❤️ 世间之人，都不如你", 
		"永远爱你 ❤️", "有你的感觉真好^_^",
		"喜欢你，认真且怂，从一而终 ❤️"
	  ];
      function createText() {
        const text = document.createElement('div');
        text.className = 'floating-text';
        text.textContent = phrases[Math.floor(Math.random() * phrases.length)];
		
		var left = Math.random() * 100;
		var scrWth = window.innerWidth - 1200;
		var left_ = (left >= scrWth) ? scrWth : left;
        text.style.left = left_  + 'vw';
        //text.style.animationDuration = (6 + Math.random() * 6) + 's';
        text.style.animationDuration = '18s';
		
        document.body.appendChild(text);
        setTimeout(() => text.remove(), 8000);
      }
      const textInterval = setInterval(createText, 2200);
      setTimeout(() => clearInterval(textInterval), 3 * 60 * 1000);
    }


    let fireworks = [];
    let particles = [];

    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const random = (min, max) => Math.random() * (max - min) + min;
    const randomInt = (min, max) => Math.floor(random(min, max));

    function hslToRgb(h, s, l) {
      s /= 100; l /= 100;
      const c = (1 - Math.abs(2 * l - 1)) * s;
      const x = c * (1 - Math.abs((h / 60) % 2 - 1));
      const m = l - c / 2;
      let r, g, b;
      if (0 <= h && h < 60) [r, g, b] = [c, x, 0];
      else if (60 <= h && h < 120) [r, g, b] = [x, c, 0];
      else if (120 <= h && h < 180) [r, g, b] = [0, c, x];
      else if (180 <= h && h < 240) [r, g, b] = [0, x, c];
      else if (240 <= h && h < 300) [r, g, b] = [x, 0, c];
      else if (300 <= h && h < 360) [r, g, b] = [c, 0, x];
      return `rgb(${Math.round((r + m) * 255)}, ${Math.round((g + m) * 255)}, ${Math.round((b + m) * 255)})`;
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = random(1, 3);
        this.velocity = { x: random(-5, 5), y: random(-5, 5) };
        this.alpha = 1;
        this.decay = random(0.01, 0.03);
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
      }

      update() {
        this.x += this.velocity.x;
        this.y += this.velocity.y;
        this.alpha -= this.decay;
        this.draw();
        return this.alpha > 0;
      }
    }

    class Firework {
      constructor(x, y, targetX, targetY, color) {
        this.x = x;
        this.y = y;
        this.targetX = targetX;
        this.targetY = targetY;
        this.color = color;
        this.speed = 3;
        this.angle = Math.atan2(targetY - y, targetX - x);
        this.vx = Math.cos(this.angle) * this.speed;
        this.vy = Math.sin(this.angle) * this.speed;
        this.trail = [];
        this.maxTrail = 5;
      }

      draw() {
        ctx.beginPath();
        ctx.moveTo(this.trail[0]?.x || this.x, this.trail[0]?.y || this.y);
        for (let point of this.trail) {
          ctx.lineTo(point.x, point.y);
        }
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      update() {
        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > this.maxTrail) this.trail.shift();

        this.x += this.vx;
        this.y += this.vy;

        const dx = this.targetX - this.x;
        const dy = this.targetY - this.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < 5) {
          this.explode();
          return false;
        }

        this.draw();
        return true;
      }

      explode() {
        const particleCount = randomInt(80, 120);
        for (let i = 0; i < particleCount; i++) {
          particles.push(new Particle(this.x, this.y, this.color));
        }
      }
    }

    function createFirework(x, y) {
      const startX = canvas.width / 2;
      const startY = canvas.height;
      const hue = randomInt(0, 360);
      const color = hslToRgb(hue, 80, 50);
      fireworks.push(new Firework(startX, startY, x, y, color));
    }

    function animate() {
      requestAnimationFrame(animate);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = fireworks.length - 1; i >= 0; i--) {
        if (!fireworks[i].update()) {
          fireworks.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        if (!particles[i].update()) {
          particles.splice(i, 1);
        }
      }
    }

    function initFireworks() {
      setInterval(() => {
        const x = random(100, canvas.width - 100);
        const y = random(100, canvas.height / 2);
        createFirework(x, y);
      }, 500);
      canvas.addEventListener('click', (e) => {
        createFirework(e.clientX, e.clientY);
      });
      canvas.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        createFirework(touch.clientX, touch.clientY);
      });

      animate();
    }

    yesBtn.addEventListener('click', () => {
      mainScreen.style.opacity = '0';
	  openFullscreen();
      setTimeout(() => {
        mainScreen.style.display = 'none';
        fireworksScreen.style.display = 'block';
        startCountdown();
      }, 800);
    });
	
	function openFullscreen() {
	  var elem = document.documentElement;
	  if (elem.requestFullscreen) {
		elem.requestFullscreen();
	  } else if (elem.mozRequestFullScreen) {
		elem.mozRequestFullScreen();
	  } else if (elem.webkitRequestFullscreen) {
		elem.webkitRequestFullscreen();
	  } else if (elem.msRequestFullscreen) {
		elem.msRequestFullscreen();
	  }
	}
	
	
  </script>
</body>
</html>
